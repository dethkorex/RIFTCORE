name: Standalone playtest releases

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-preview'
  workflow_dispatch:
    inputs:
      preview_tag:
        description: Version shown in preview build artifacts
        default: v0.5.0
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Godot and installer compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          mkdir -p release-tools/templates
          touch release-tools/.gdignore
          curl -fsSL --retry 3 -o release-tools/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q release-tools/godot.zip -d release-tools
          chmod +x release-tools/Godot_v4.7.2-stable_linux.x86_64
          python3 distribution/fetch_templates.py release-tools/templates
          curl -fsSL --retry 3 -o release-tools/GODOT_LICENSE.txt https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/LICENSE.txt
          curl -fsSL --retry 3 -o release-tools/GODOT_COPYRIGHT.txt https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/COPYRIGHT.txt
      - name: Build installers and release manifest
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
          PREVIEW_TAG: ${{ inputs.preview_tag }}
        run: |
          tag="$PREVIEW_TAG"
          if [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; fi
          python3 distribution/build_release.py --engine release-tools/Godot_v4.7.2-stable_linux.x86_64             --templates release-tools/templates --licenses release-tools --nsis /usr/bin/makensis             --work release-tools/build --out release-tools/artifacts --tag "$tag" --repo "$RELEASE_REPO"
      - name: Verify release notes
        run: |
          python3 -c 'import json, pathlib; p=pathlib.Path("release-tools/artifacts"); assert json.loads((p / "update.json").read_text())["notes"] == (p / "PATCH_NOTES.md").read_text().strip()'
      - name: Install and smoke-test Linux build
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          ./release-tools/artifacts/RIFTCORE-Linux-x64-Setup.run
          build="$(find "$XDG_DATA_HOME/riftcore/versions" -name RIFTCORE -type f | head -1)"
          test -x "$build"
          "$build" --headless --quit-after 100 --log-file "$RUNNER_TEMP/riftcore-smoke.log"
          ! grep -E 'SCRIPT ERROR:|Failed to load' "$RUNNER_TEMP/riftcore-smoke.log"
          test -s release-tools/artifacts/RIFTCORE-Windows-x64-Setup.exe
      - name: Test portable and installed builds on Arch
        run: |
          docker run --rm -v "$PWD/release-tools/artifacts:/artifacts:ro" archlinux:latest sh -ec '
            pacman -Syu --noconfirm ca-certificates mesa libglvnd libx11 libxrandr libxi libxcursor libxinerama libxkbcommon wayland
            tar -xzf /artifacts/RIFTCORE-Arch-Omarchy-x64.tar.gz -C /tmp
            cd /tmp/RIFTCORE
            test -x start-riftcore
            test -x install.sh
            sh -n start-riftcore
            ./start-riftcore --headless --quit-after 30 --log-file /tmp/launcher.log
            export XDG_DATA_HOME="/tmp/riftcore user data"
            ./install.sh
            test -x "$XDG_DATA_HOME/riftcore/start-riftcore"
            "$XDG_DATA_HOME/riftcore/start-riftcore" --headless --quit-after 30 --log-file /tmp/installed.log
            build="$(find "$XDG_DATA_HOME/riftcore/versions" -name RIFTCORE -type f)"
            "$build" --headless --quit-after 60 --log-file /tmp/game.log
            ! grep -E "SCRIPT ERROR:|Failed to load" /tmp/launcher.log /tmp/installed.log /tmp/game.log
          '
      - uses: actions/upload-artifact@v4
        with:
          name: riftcore-playtest
          path: release-tools/artifacts/*
      - name: Publish tagged preview
        if: github.ref_type == 'tag' && endsWith(github.ref_name, '-preview')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-tools/artifacts/* --verify-tag --notes-file release-tools/artifacts/PATCH_NOTES.md --title "RIFTCORE 0.5 Preview and Installer 0.2" --prerelease --latest=false
      - name: Publish tagged release
        if: github.ref_type == 'tag' && !endsWith(github.ref_name, '-preview')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-tools/artifacts/* --verify-tag --notes-file release-tools/artifacts/PATCH_NOTES.md --latest
