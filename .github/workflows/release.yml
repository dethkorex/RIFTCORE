name: Standalone playtest releases

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-preview'
  workflow_dispatch:
    inputs:
      preview_tag:
        description: Version shown in preview build artifacts
        default: v0.5.0
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Godot and installer compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          mkdir -p release-tools/templates
          touch release-tools/.gdignore
          curl -fsSL --retry 3 -o release-tools/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q release-tools/godot.zip -d release-tools
          chmod +x release-tools/Godot_v4.7.2-stable_linux.x86_64
          python3 distribution/fetch_templates.py release-tools/templates
          curl -fsSL --retry 3 -o release-tools/GODOT_LICENSE.txt https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/LICENSE.txt
          curl -fsSL --retry 3 -o release-tools/GODOT_COPYRIGHT.txt https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/COPYRIGHT.txt
      - name: Build installers and release manifest
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
          PREVIEW_TAG: ${{ inputs.preview_tag }}
          GDSYNC_PUBLIC_KEY: ${{ secrets.GDSYNC_PUBLIC_KEY }}
          GDSYNC_PRIVATE_KEY: ${{ secrets.GDSYNC_PRIVATE_KEY }}
        run: |
          if [ -z "$GDSYNC_PUBLIC_KEY" ] || [ -z "$GDSYNC_PRIVATE_KEY" ]; then
            echo 'The RIFTCORE relay keys are missing from the release configuration.'
            exit 1
          fi
          tag="$PREVIEW_TAG"
          if [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; fi
          python3 distribution/build_release.py --engine release-tools/Godot_v4.7.2-stable_linux.x86_64             --templates release-tools/templates --licenses release-tools --nsis /usr/bin/makensis             --work release-tools/build --out release-tools/artifacts --tag "$tag" --repo "$RELEASE_REPO"
      - name: Verify release notes
        run: |
          python3 -c 'import json, pathlib; p=pathlib.Path("release-tools/artifacts"); assert json.loads((p / "update.json").read_text())["notes"] == (p / "PATCH_NOTES.md").read_text().strip()'
      - name: Recover an interrupted Linux update
        run: |
          engine="$PWD/release-tools/Godot_v4.7.2-stable_linux.x86_64"
          "$engine" --headless --path "$PWD" --script "$PWD/distribution/verify_update.gd" -- "$PWD/release-tools/artifacts/RIFTCORE-linux-x64.zip" "$RUNNER_TEMP/in-game update QA"
      - name: Install and smoke-test Linux build
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          ./release-tools/artifacts/RIFTCORE-Linux-x64-Setup.run
          build="$(find "$XDG_DATA_HOME/riftcore/versions" -name RIFTCORE -type f | head -1)"
          test -x "$build"
          "$build" --headless --quit-after 100 --log-file "$RUNNER_TEMP/riftcore-smoke.log"
          ! grep -E 'SCRIPT ERROR:|Failed to load' "$RUNNER_TEMP/riftcore-smoke.log"
          test -s release-tools/artifacts/RIFTCORE-Windows-x64-Setup.exe
      - name: Play the packaged Linux co-op mission
        run: |
          base="$(mktemp -d)"
          unzip -q release-tools/artifacts/RIFTCORE-linux-x64.zip -d "$base"
          chmod +x "$base/RIFTCORE"
          python3 distribution/verify_coop.py "$base/RIFTCORE"
      - name: Test portable and installed builds on Arch
        run: |
          docker run --rm -v "$PWD/release-tools/artifacts:/artifacts:ro" archlinux:latest sh -ec '
            pacman -Syu --noconfirm ca-certificates mesa libglvnd libx11 libxrandr libxi libxcursor libxinerama libxkbcommon wayland
            tar -xzf /artifacts/RIFTCORE-Arch-Omarchy-x64.tar.gz -C /tmp
            cd /tmp/RIFTCORE
            test -x start-riftcore
            test -x install.sh
            sh -n start-riftcore
            ./start-riftcore --headless --quit-after 30 --log-file /tmp/launcher.log
            export XDG_DATA_HOME="/tmp/riftcore user data"
            ./install.sh
            test -x "$XDG_DATA_HOME/riftcore/start-riftcore"
            test -x "$XDG_DATA_HOME/riftcore/RIFTCORE"
            "$XDG_DATA_HOME/riftcore/RIFTCORE" --headless --quit-after 30 --log-file /tmp/native.log
            grep -F "Exec=\"$XDG_DATA_HOME/riftcore/RIFTCORE\"" "$XDG_DATA_HOME/applications/riftcore.desktop"
            "$XDG_DATA_HOME/riftcore/start-riftcore" --headless --quit-after 30 --log-file /tmp/installed.log
            build="$(find "$XDG_DATA_HOME/riftcore/versions" -name RIFTCORE -type f)"
            "$build" --headless --quit-after 60 --log-file /tmp/game.log -- --verify-social --require-relay
            grep -F "SOCIAL SMOKE PASS" /tmp/game.log
            ! grep -E "SCRIPT ERROR:|Failed to load" /tmp/launcher.log /tmp/native.log /tmp/installed.log /tmp/game.log
          '
      - name: Verify the Launcher 0.1 migration on Linux
        run: |
          base="$(mktemp -d)"
          mkdir -p "$base/versions/v0.4.100"
          unzip -q release-tools/legacy-migration/RIFTCORE-linux-x64.zip -d "$base/versions/v0.4.100"
          printf '#!/bin/sh\nexit 0\n' > "$base/RIFTCORE"
          printf '[updates]\nrepository=""\n' > "$base/updates.cfg"
          printf 'preserved\n' > "$base/save-marker"
          chmod +x "$base/RIFTCORE" "$base/versions/v0.4.100/RIFTCORE"
          "$base/versions/v0.4.100/RIFTCORE" --headless --quit-after 300
          cmp "$base/RIFTCORE" "$base/versions/v0.4.100/RIFTCORE"
          grep -qx preserved "$base/save-marker"
          grep -q 'preview_channel=true' "$base/updates.cfg"
      - uses: actions/upload-artifact@v4
        with:
          name: riftcore-legacy-migration
          path: release-tools/legacy-migration/*
      - uses: actions/upload-artifact@v4
        with:
          name: riftcore-playtest
          path: release-tools/artifacts/*
  windows-smoke:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: riftcore-playtest
      - name: Start the exported Windows build and check Social
        shell: pwsh
        run: |
          Expand-Archive RIFTCORE-windows-x64.zip -DestinationPath game
          $game = Join-Path $PWD 'game/RIFTCORE.exe'
          $log = Join-Path $PWD 'windows-social.log'
          $run = Start-Process -FilePath $game -ArgumentList @('--headless','--quit-after','120','--log-file',('"' + $log + '"'),'--','--verify-social','--require-relay') -Wait -PassThru
          Get-Content -LiteralPath $log
          if ($run.ExitCode -ne 0 -or !(Select-String -LiteralPath $log -Pattern 'SOCIAL SMOKE PASS' -Quiet)) { exit 1 }

      - name: Play the packaged Windows co-op mission
        shell: pwsh
        run: python distribution/verify_coop.py game/RIFTCORE.exe
      - uses: actions/download-artifact@v4
        with:
          name: riftcore-legacy-migration
          path: migration
      - name: Verify the Launcher 0.1 migration on Windows
        shell: pwsh
        run: |
          $base = Join-Path $PWD 'legacy install'
          $version = Join-Path $base 'versions/v0.4.100'
          Expand-Archive migration/RIFTCORE-windows-x64.zip -DestinationPath $version
          $target = Join-Path $base 'RIFTCORE.exe'
          $bridge = Join-Path $version 'RIFTCORE.exe'
          Copy-Item (Join-Path $PWD 'game/RIFTCORE.exe') $target
          Set-Content (Join-Path $base 'updates.cfg') "[updates]`nrepository=`"`""
          Set-Content (Join-Path $base 'save-marker') 'preserved'
          $run = Start-Process -FilePath $bridge -ArgumentList @('--headless','--quit-after','600') -Wait -PassThru
          if ($run.ExitCode -ne 0 -or (Get-FileHash $target).Hash -ne (Get-FileHash $bridge).Hash) { exit 1 }
          if ((Get-Content (Join-Path $base 'save-marker')) -ne 'preserved') { exit 1 }
          if (!(Select-String -LiteralPath (Join-Path $base 'updates.cfg') -Pattern 'preview_channel=true' -Quiet)) { exit 1 }

  publish:
    if: github.ref_type == 'tag'
    needs: [package, windows-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: riftcore-playtest
          path: release-tools/artifacts
      - name: Publish tagged preview
        if: github.ref_type == 'tag' && endsWith(github.ref_name, '-preview')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create --repo "${{ github.repository }}" "$RELEASE_TAG" release-tools/artifacts/* --verify-tag --notes-file release-tools/artifacts/PATCH_NOTES.md --title "RIFTCORE ${RELEASE_TAG#v} and Installer 0.2" --prerelease --latest=false
      - name: Publish tagged release
        if: github.ref_type == 'tag' && !endsWith(github.ref_name, '-preview')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create --repo "${{ github.repository }}" "$RELEASE_TAG" release-tools/artifacts/* --verify-tag --notes-file release-tools/artifacts/PATCH_NOTES.md --latest

      - uses: actions/download-artifact@v4
        if: github.ref_name == 'v0.5.6-preview'
        with:
          name: riftcore-legacy-migration
          path: release-tools/legacy-migration
      - name: Publish the Launcher 0.1 migration on the original update channel
        if: github.ref_name == 'v0.5.6-preview'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create --repo "${{ github.repository }}" v0.4.100 release-tools/legacy-migration/* \
            --target "${{ github.sha }}" --notes-file release-tools/legacy-migration/PATCH_NOTES.md \
            --title "RIFTCORE Launcher 0.2 migration" --latest
